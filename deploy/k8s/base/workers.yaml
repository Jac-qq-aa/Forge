apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-zhihu-worker
  namespace: forge
  labels:
    app.kubernetes.io/name: forge-zhihu-worker
    app.kubernetes.io/part-of: forge
spec:
  selector: {matchLabels: {app.kubernetes.io/name: forge-zhihu-worker, app.kubernetes.io/part-of: forge}}
  template:
    metadata: {labels: {app.kubernetes.io/name: forge-zhihu-worker, app.kubernetes.io/part-of: forge}}
    spec:
      serviceAccountName: forge
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: forge-zhihu-worker}}
      containers:
        - name: worker
          image: forge-app:phase-2
          command: [python, -m, forge.async_jobs.worker]
          env:
            - {name: ASYNC_SERVICE_ROLE, value: zhihu-worker}
            - {name: ZHIHU_JOB_CONCURRENCY, value: "2"}
            - {name: ZHIHU_BROWSER_POOL_SIZE, value: "2"}
            - {name: ZHIHU_GLOBAL_REQUESTS_PER_SECOND, value: "0.5"}
            - {name: PG_POOL_MAX_SIZE, value: "2"}
            - {name: REDIS_MAX_CONNECTIONS, value: "30"}
          envFrom:
            - configMapRef: {name: forge-config}
            - secretRef: {name: forge-secrets}
          ports: [{name: metrics, containerPort: 9100}]
          readinessProbe: {tcpSocket: {port: metrics}, initialDelaySeconds: 10}
          livenessProbe: {tcpSocket: {port: metrics}, initialDelaySeconds: 30}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "3", memory: 5Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: dev-shm, mountPath: /dev/shm}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: dev-shm, emptyDir: {medium: Memory, sizeLimit: 1Gi}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: forge-zhihu-worker-metrics
  namespace: forge
  labels: {app.kubernetes.io/name: forge-zhihu-worker, app.kubernetes.io/part-of: forge}
spec:
  selector: {app.kubernetes.io/name: forge-zhihu-worker, app.kubernetes.io/part-of: forge}
  ports: [{name: metrics, port: 9100, targetPort: metrics}]
