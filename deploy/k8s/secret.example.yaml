apiVersion: v1
kind: Secret
metadata:
  name: forge-secrets
  namespace: forge
type: Opaque
stringData:
  PG_HOST: pgbouncer.database.svc.cluster.local
  PG_USER: forge
  PG_PASSWORD: replace-me
  PG_SSL: "true"
  REDIS_HOST: redis-ha.database.svc.cluster.local
  REDIS_PASSWORD: replace-me
  REDIS_SSL: "true"
  ROCKETMQ_ENDPOINTS: rocketmq-proxy.messaging.svc.cluster.local:8081
  ROCKETMQ_ACCESS_KEY: replace-me
  ROCKETMQ_SECRET_KEY: replace-me
  LANGGRAPH_SERVER_URL: https://replace-with-production-agent-server
  FORGE_JWT_SECRET: replace-with-at-least-32-random-bytes
  FORGE_JWT_ISSUER: forge-auth
  FORGE_JWT_AUDIENCE: forge-api
  METRICS_BEARER_TOKEN: replace-with-monitoring-only-token
  JOB_RESULT_S3_BUCKET: forge-production-results
  JOB_RESULT_S3_ENDPOINT: https://s3.example.com
  AWS_REGION: ap-southeast-1
  AWS_ACCESS_KEY_ID: replace-me
  AWS_SECRET_ACCESS_KEY: replace-me
  QWEN_API_KEY: replace-me
  LANGCHAIN_API_KEY: replace-me
