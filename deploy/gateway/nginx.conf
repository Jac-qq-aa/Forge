events {}

http {
    log_format forge_json escape=json '{"event":"gateway.request","request_id":"$request_id",'
        '"trace_id":"$upstream_http_x_trace_id","method":"$request_method","path":"$uri",'
        '"status":$status,"duration_seconds":$request_time,"upstream_status":"$upstream_status"}';
    access_log /dev/stdout forge_json;
    limit_req_zone $binary_remote_addr zone=forge_api:10m rate=20r/s;

    upstream forge_api {
        server api:8000;
    }

    server {
        listen 8080;
        client_max_body_size 5m;

        location = /health {
            proxy_pass http://forge_api/health;
        }

        location /v1/auth/ {
            limit_req zone=forge_api burst=40 nodelay;
            proxy_pass http://forge_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location /v1/conversations {
            auth_request /_auth;
            limit_req zone=forge_api burst=40 nodelay;
            proxy_pass http://forge_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        location = /_auth {
            internal;
            proxy_pass http://forge_api/internal/auth/verify;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Request-ID $request_id;
        }

        location /internal/ {
            return 404;
        }
    }
}
