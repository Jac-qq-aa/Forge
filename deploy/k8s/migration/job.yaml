apiVersion: batch/v1
kind: Job
metadata:
  name: forge-migrate
  namespace: forge
  labels: {app.kubernetes.io/name: forge-migrate, app.kubernetes.io/part-of: forge}
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app.kubernetes.io/name: forge-migrate}}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: forge
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: forge-app:phase-2
          command: [python, -m, forge.async_jobs.migrate]
          envFrom:
            - configMapRef: {name: forge-config}
            - secretRef: {name: forge-secrets}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
