apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: forge
  namespace: forge
  labels: {app.kubernetes.io/part-of: forge}
spec:
  namespaceSelector: {matchNames: [forge]}
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [forge-outbox, forge-workflow-worker, forge-generation-worker, forge-zhihu-worker]
  podMetricsEndpoints:
    - {port: metrics, path: /metrics, interval: 15s}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: forge-api
  namespace: forge
  labels: {app.kubernetes.io/part-of: forge}
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [forge-web, forge-gateway]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      authorization:
        credentials:
          name: forge-secrets
          key: METRICS_BEARER_TOKEN
