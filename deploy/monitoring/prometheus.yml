global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: forge-process
    static_configs:
      - targets: ['api:9001', 'consumer:9001', 'index-consumer:9001', 'audit-consumer:9001', 'outbox:9001', 'langgraph:9001']
  - job_name: forge-jobs
    static_configs:
      - targets: ['monitoring:9000']
  - job_name: rocketmq
    static_configs:
      - targets: ['broker:5557']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
