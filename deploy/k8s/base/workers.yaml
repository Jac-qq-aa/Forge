apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-outbox
  namespace: forge
  labels:
    app.kubernetes.io/name: forge-outbox
    app.kubernetes.io/part-of: forge
spec:
  replicas: 3
  selector: {matchLabels: {app.kubernetes.io/name: forge-outbox, app.kubernetes.io/part-of: forge}}
  template:
    metadata: {labels: {app.kubernetes.io/name: forge-outbox, app.kubernetes.io/part-of: forge}}
    spec:
      serviceAccountName: forge
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: outbox
          image: forge-app:phase-2
          command: [python, -m, forge.async_jobs.worker]
          env:
            - {name: ASYNC_SERVICE_ROLE, value: outbox}
            - {name: PG_POOL_MAX_SIZE, value: "2"}
          envFrom:
            - configMapRef: {name: forge-config}
            - secretRef: {name: forge-secrets}
          ports: [{name: metrics, containerPort: 9100}]
          readinessProbe: {tcpSocket: {port: metrics}, initialDelaySeconds: 5}
          livenessProbe: {tcpSocket: {port: metrics}, initialDelaySeconds: 15}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: forge-outbox-metrics
  namespace: forge
  labels: {app.kubernetes.io/name: forge-outbox, app.kubernetes.io/part-of: forge}
spec:
  selector: {app.kubernetes.io/name: forge-outbox, app.kubernetes.io/part-of: forge}
  ports: [{name: metrics, port: 9100, targetPort: metrics}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-workflow-worker
  namespace: forge
  labels:
    app.kubernetes.io/name: forge-workflow-worker
    app.kubernetes.io/part-of: forge
spec:
  selector: {matchLabels: {app.kubernetes.io/name: forge-workflow-worker, app.kubernetes.io/part-of: forge}}
  template:
    metadata: {labels: {app.kubernetes.io/name: forge-workflow-worker, app.kubernetes.io/part-of: forge}}
    spec:
      serviceAccountName: forge
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: forge-workflow-worker}}
      containers:
        - name: worker
          image: forge-app:phase-2
          command: [python, -m, forge.async_jobs.worker]
          env:
            - {name: ASYNC_SERVICE_ROLE, value: worker}
            - {name: JOB_CONSUMER_CONCURRENCY, value: "4"}
            - {name: PG_POOL_MAX_SIZE, value: "2"}
            - {name: REDIS_MAX_CONNECTIONS, value: "30"}
          envFrom:
            - configMapRef: {name: forge-config}
            - secretRef: {name: forge-secrets}
          ports: [{name: metrics, containerPort: 9100}]
          readinessProbe: {tcpSocket: {port: metrics}, initialDelaySeconds: 5}
          livenessProbe: {tcpSocket: {port: metrics}, initialDelaySeconds: 15}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "4", memory: 6Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: output, mountPath: /app/output}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: output, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
