# Forge 生产环境部署配置
# 使用方式: docker compose -f docker-compose.prod.yml up -d
# 注意: Milvus 服务需要单独启动或已存在
# 端口: Gateway=13324, Web=13326；LangGraph 使用外部生产 Agent Server

services:
  # ============================================
  # PostgreSQL - 任务、Outbox 与业务持久化
  # ============================================
  postgres:
    container_name: forge-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:?PG_USER is required}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      POSTGRES_DB: ${PG_DATABASE:-forge}
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DATABASE:-forge}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - forge-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment: &postgres-environment
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:?PG_USER is required}
      PG_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      PG_DATABASE: ${PG_DATABASE:-forge}
    command: python -m forge.async_jobs.migrate
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - forge-network

  # ============================================
  # RocketMQ 5.x - nameserver 与内置 gRPC Proxy
  # ============================================
  rocketmq-volume-init:
    image: apache/rocketmq:5.3.2
    user: "0:0"
    command: >-
      sh -c "chown -R rocketmq:rocketmq
      /var/forge/namesrv-logs /var/forge/broker-logs /var/forge/broker-store"
    volumes:
      - rocketmq-namesrv-logs:/var/forge/namesrv-logs
      - rocketmq-broker-logs:/var/forge/broker-logs
      - rocketmq-broker-store:/var/forge/broker-store
    restart: "no"

  rocketmq-namesrv:
    container_name: forge-rocketmq-namesrv
    image: apache/rocketmq:5.3.2
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    depends_on:
      rocketmq-volume-init:
        condition: service_completed_successfully
    networks:
      - forge-network

  rocketmq:
    container_name: forge-rocketmq
    image: apache/rocketmq:5.3.2
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    ports:
      - "10911:10911"
      - "8081:8081"
    volumes:
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
    depends_on:
      rocketmq-volume-init:
        condition: service_completed_successfully
      rocketmq-namesrv:
        condition: service_started
    networks:
      - forge-network

  rocketmq-init:
    image: apache/rocketmq:5.3.2
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      ROCKETMQ_GENERATION_TOPIC: forge-generation-tasks
      ROCKETMQ_GENERATION_RETRY_TOPIC: forge-generation-retries
      ROCKETMQ_GENERATION_CONSUMER_GROUP: forge-generation-workers
      ROCKETMQ_GENERATION_QUEUE_COUNT: ${ROCKETMQ_GENERATION_QUEUE_COUNT:-8}
      ROCKETMQ_BROKER_RETRY_MAX_TIMES: ${ROCKETMQ_BROKER_RETRY_MAX_TIMES:-8}
    volumes:
      - ./deploy/rocketmq/init.sh:/opt/forge/init-rocketmq.sh:ro
    command: sh /opt/forge/init-rocketmq.sh
    depends_on:
      rocketmq:
        condition: service_started
    restart: "no"
    networks:
      - forge-network

  # ============================================
  # Redis - 会话缓存
  # ============================================
  redis:
    container_name: forge-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - forge-network
      - milvus

  # ============================================
  # Gateway API - FastAPI 入口
  # ============================================
  gateway:
    container_name: forge-gateway
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "13324:8000"
    environment:
      - LANGGRAPH_SERVER_URL=${LANGGRAPH_SERVER_URL:?production LangGraph server URL is required}
      - FORGE_JWT_SECRET=${FORGE_JWT_SECRET:?FORGE_JWT_SECRET is required}
      - FORGE_JWT_ISSUER=${FORGE_JWT_ISSUER:-forge-auth}
      - FORGE_JWT_AUDIENCE=${FORGE_JWT_AUDIENCE:-forge-api}
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
      - TENANT_SUBMISSIONS_PER_MINUTE=${TENANT_SUBMISSIONS_PER_MINUTE:-60}
      - USER_SUBMISSIONS_PER_MINUTE=${USER_SUBMISSIONS_PER_MINUTE:-20}
      - TENANT_MAX_ACTIVE_JOBS=${TENANT_MAX_ACTIVE_JOBS:-10}
      - USER_MAX_ACTIVE_JOBS=${USER_MAX_ACTIVE_JOBS:-3}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-200}
      - REDIS_SOCKET_TIMEOUT_SECONDS=${REDIS_SOCKET_TIMEOUT_SECONDS:-2}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:?PG_USER is required}
      - PG_PASSWORD=${PG_PASSWORD:?PG_PASSWORD is required}
      - PG_DATABASE=${PG_DATABASE:-forge}
      - JOB_RESULT_S3_BUCKET=${JOB_RESULT_S3_BUCKET:?JOB_RESULT_S3_BUCKET is required}
      - JOB_RESULT_S3_PREFIX=${JOB_RESULT_S3_PREFIX:-workflow-results}
      - JOB_RESULT_S3_ENDPOINT=${JOB_RESULT_S3_ENDPOINT:-}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - MILVUS_HOST=standalone
      - MILVUS_PORT=19530
    volumes:
      - ./forge:/app/forge
      - ./.env:/app/.env
    command: uvicorn forge.gateway.app:app --host 0.0.0.0 --port 8000
    depends_on:
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - forge-network
      - milvus

  # ============================================
  # Web UI - 前端界面
  # ============================================
  web:
    container_name: forge-web
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "13326:8000"
    environment:
      - GATEWAY_API_URL=http://gateway:8000
      - FORGE_JWT_SECRET=${FORGE_JWT_SECRET:?FORGE_JWT_SECRET is required}
      - FORGE_JWT_ISSUER=${FORGE_JWT_ISSUER:-forge-auth}
      - FORGE_JWT_AUDIENCE=${FORGE_JWT_AUDIENCE:-forge-api}
      - METRICS_BEARER_TOKEN=${METRICS_BEARER_TOKEN:?METRICS_BEARER_TOKEN is required}
      - TENANT_SUBMISSIONS_PER_MINUTE=${TENANT_SUBMISSIONS_PER_MINUTE:-60}
      - USER_SUBMISSIONS_PER_MINUTE=${USER_SUBMISSIONS_PER_MINUTE:-20}
      - TENANT_MAX_ACTIVE_JOBS=${TENANT_MAX_ACTIVE_JOBS:-10}
      - USER_MAX_ACTIVE_JOBS=${USER_MAX_ACTIVE_JOBS:-3}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-200}
      - REDIS_SOCKET_TIMEOUT_SECONDS=${REDIS_SOCKET_TIMEOUT_SECONDS:-2}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:?PG_USER is required}
      - PG_PASSWORD=${PG_PASSWORD:?PG_PASSWORD is required}
      - PG_DATABASE=${PG_DATABASE:-forge}
      - JOB_RESULT_S3_BUCKET=${JOB_RESULT_S3_BUCKET:?JOB_RESULT_S3_BUCKET is required}
      - JOB_RESULT_S3_PREFIX=${JOB_RESULT_S3_PREFIX:-workflow-results}
      - JOB_RESULT_S3_ENDPOINT=${JOB_RESULT_S3_ENDPOINT:-}
      - AWS_REGION=${AWS_REGION:-ap-southeast-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - MILVUS_HOST=standalone
      - MILVUS_PORT=19530
    volumes:
      - ./forge:/app/forge
      - ./.env:/app/.env
    command: uvicorn forge.web.app:app --host 0.0.0.0 --port 8000
    depends_on:
      - gateway
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - forge-network
      - milvus

  # ============================================
  # Outbox 发布器 - 数据库事件可靠投递到 RocketMQ
  # ============================================
  outbox:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      <<: *postgres-environment
      ASYNC_SERVICE_ROLE: outbox
      ROCKETMQ_ENDPOINTS: rocketmq:8081
      ROCKETMQ_WORKFLOW_TOPIC: forge-workflow-jobs
      ROCKETMQ_ZHIHU_TOPIC: forge-zhihu-jobs
      OUTBOX_PUBLISH_CONCURRENCY: ${OUTBOX_PUBLISH_CONCURRENCY:-16}
      OUTBOX_LOCK_SECONDS: ${OUTBOX_LOCK_SECONDS:-120}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}
    command: python -m forge.async_jobs.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      rocketmq-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - forge-network

  # ============================================
  # Workflow Worker - 可水平扩容
  # ============================================
  workflow-worker:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      <<: *postgres-environment
      ASYNC_SERVICE_ROLE: worker
      ROCKETMQ_ENDPOINTS: rocketmq:8081
      ROCKETMQ_WORKFLOW_TOPIC: forge-workflow-jobs
      ROCKETMQ_WORKFLOW_CONSUMER_GROUP: forge-workflow-workers
      LANGGRAPH_SERVER_URL: ${LANGGRAPH_SERVER_URL:?production LangGraph server URL is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-200}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-2}
      JOB_CONSUMER_CONCURRENCY: ${JOB_CONSUMER_CONCURRENCY:-4}
      JOB_CONSUMER_PREFETCH: ${JOB_CONSUMER_PREFETCH:-0}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-1800}
      PG_POOL_MIN_SIZE: ${WORKER_PG_POOL_MIN_SIZE:-1}
      PG_POOL_MAX_SIZE: ${WORKER_PG_POOL_MAX_SIZE:-6}
      JOB_RESULT_S3_BUCKET: ${JOB_RESULT_S3_BUCKET:?JOB_RESULT_S3_BUCKET is required}
      JOB_RESULT_S3_PREFIX: ${JOB_RESULT_S3_PREFIX:-workflow-results}
      JOB_RESULT_S3_ENDPOINT: ${JOB_RESULT_S3_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    command: python -m forge.async_jobs.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      rocketmq-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - forge-network
      - milvus

  # ============================================
  # Generation Worker - 单条消息执行到完成或下一个 HITL
  # ============================================
  generation-worker:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      <<: *postgres-environment
      ASYNC_SERVICE_ROLE: generation-worker
      ROCKETMQ_ENDPOINTS: rocketmq:8081
      ROCKETMQ_GENERATION_TOPIC: forge-generation-tasks
      ROCKETMQ_GENERATION_RETRY_TOPIC: forge-generation-retries
      ROCKETMQ_GENERATION_CONSUMER_GROUP: forge-generation-workers
      LANGGRAPH_SERVER_URL: ${LANGGRAPH_SERVER_URL:?production LangGraph server URL is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GENERATION_WORKER_CONCURRENCY: ${GENERATION_WORKER_CONCURRENCY:-4}
      GENERATION_EVENT_MAX_ATTEMPTS: ${GENERATION_EVENT_MAX_ATTEMPTS:-3}
      GENERATION_TASK_TIMEOUT_SECONDS: ${GENERATION_TASK_TIMEOUT_SECONDS:-7200}
      GENERATION_RETRY_BASE_SECONDS: ${GENERATION_RETRY_BASE_SECONDS:-15}
      GENERATION_RETRY_MAX_SECONDS: ${GENERATION_RETRY_MAX_SECONDS:-300}
      GENERATION_MAX_REVISION_ROUNDS: ${GENERATION_MAX_REVISION_ROUNDS:-2}
      GENERATION_TOKEN_BUDGET: ${GENERATION_TOKEN_BUDGET:-0}
      GENERATION_RECONCILE_INTERVAL_SECONDS: ${GENERATION_RECONCILE_INTERVAL_SECONDS:-30}
      GENERATION_RECONCILE_BATCH_SIZE: ${GENERATION_RECONCILE_BATCH_SIZE:-100}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-1800}
      JOB_MESSAGE_INVISIBLE_SECONDS: ${JOB_MESSAGE_INVISIBLE_SECONDS:-1860}
      PG_POOL_MIN_SIZE: ${WORKER_PG_POOL_MIN_SIZE:-1}
      PG_POOL_MAX_SIZE: ${WORKER_PG_POOL_MAX_SIZE:-6}
      JOB_RESULT_S3_BUCKET: ${JOB_RESULT_S3_BUCKET:?JOB_RESULT_S3_BUCKET is required}
      JOB_RESULT_S3_PREFIX: ${JOB_RESULT_S3_PREFIX:-workflow-results}
      JOB_RESULT_S3_ENDPOINT: ${JOB_RESULT_S3_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    command: python -m forge.async_jobs.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      rocketmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - forge-network
      - milvus

  # ============================================
  # Zhihu Worker - 浏览器池、分布式限速与缓存
  # ============================================
  zhihu-worker:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      <<: *postgres-environment
      ASYNC_SERVICE_ROLE: zhihu-worker
      ROCKETMQ_ENDPOINTS: rocketmq:8081
      ROCKETMQ_ZHIHU_TOPIC: forge-zhihu-jobs
      ROCKETMQ_ZHIHU_CONSUMER_GROUP: forge-zhihu-workers
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-200}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-2}
      ZHIHU_JOB_CONCURRENCY: ${ZHIHU_JOB_CONCURRENCY:-4}
      JOB_CONSUMER_PREFETCH: ${JOB_CONSUMER_PREFETCH:-0}
      ZHIHU_BROWSER_POOL_SIZE: ${ZHIHU_BROWSER_POOL_SIZE:-4}
      ZHIHU_GLOBAL_REQUESTS_PER_SECOND: ${ZHIHU_GLOBAL_REQUESTS_PER_SECOND:-0.5}
      ZHIHU_GLOBAL_BURST: ${ZHIHU_GLOBAL_BURST:-2}
      ZHIHU_RESULT_CACHE_SECONDS: ${ZHIHU_RESULT_CACHE_SECONDS:-300}
      ZHIHU_REQUEST_DEDUP_SECONDS: ${ZHIHU_REQUEST_DEDUP_SECONDS:-30}
      PG_POOL_MIN_SIZE: ${ZHIHU_PG_POOL_MIN_SIZE:-1}
      PG_POOL_MAX_SIZE: ${ZHIHU_PG_POOL_MAX_SIZE:-6}
      JOB_RESULT_S3_BUCKET: ${JOB_RESULT_S3_BUCKET:?JOB_RESULT_S3_BUCKET is required}
      JOB_RESULT_S3_PREFIX: ${JOB_RESULT_S3_PREFIX:-workflow-results}
      JOB_RESULT_S3_ENDPOINT: ${JOB_RESULT_S3_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    command: python -m forge.async_jobs.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      rocketmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: unless-stopped
    shm_size: "1gb"
    networks:
      - forge-network

networks:
  forge-network:
    name: forge-network
    driver: bridge
  milvus:
    name: milvus
    external: true

volumes:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:
